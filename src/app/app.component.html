<div class="video-container">
  <video id="my-video" class="video-js vjs-default-skin" playsinline>
    <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
    <p class="vjs-no-js">
      Video.js'i görüntülemek için lütfen JavaScript'i etkinleştirin
    </p>
  </video>
  <div class="play-icon" [class.hidden]="!showPlayIcon" (click)="playVideo()"></div>
</div>

<div class="quality-selector" [class.hidden]="!isMenuOpen" [class.active]="isQualitySelectorActive">
  <div class="quality-label">Video Kalitesi</div>
  <div class="quality-value" [class.selected]="isQualitySelectorActive">
    {{availableQualities[selectedQualityIndex]?.label || 'Otomatik'}}
  </div>
</div>

<div class="side-menu" [class.open]="isMenuOpen">
  <div class="menu-content" #menuContent>
    <h2>Kanal Listesi</h2>
    <ul>
      <li *ngFor="let channel of channels; let i = index" 
          [class.selected]="i === selectedIndex">
        <img [src]="channel.poster" [alt]="channel.name">
        <span>{{ channel.name }}</span>
      </li>
    </ul>
  </div>
</div>

<router-outlet></router-outlet>

<style>
  .video-container {
    width: 100vw;
    height: 100vh;
    margin: 0;
    padding: 0;
    position: fixed;
    top: 0;
    left: 0;
    background: #000;
  }
  
  .video-js {
    width: 100%;
    height: 100%;
  }

  .vjs-control-bar {
    display: none !important;
  }

  .side-menu {
    position: fixed;
    top: 0;
    left: -300px;
    width: 300px;
    height: 100vh;
    background: rgba(0, 0, 0, 0.9);
    transition: left 0.3s ease;
    z-index: 1000;
    color: white;
  }

  .side-menu.open {
    left: 0;
  }

  .menu-content {
    padding: 20px;
    height: 100vh;
    overflow-y: auto;
  }

  .menu-content h2 {
    margin-bottom: 20px;
    color: white;
    text-align: center;
    position: sticky;
    top: 0;
    background: rgba(0, 0, 0, 0.9);
    padding: 10px 0;
    z-index: 1;
  }

  .menu-content ul {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  .menu-content li {
    padding: 15px;
    margin: 5px 0;
    cursor: pointer;
    transition: background 0.3s ease;
    border-radius: 5px;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 15px;
  }

  .menu-content li img {
    width: 40px;
    height: 40px;
    object-fit: contain;
  }

  .menu-content li span {
    flex: 1;
  }

  .menu-content li:hover {
    background: rgba(255, 255, 255, 0.1);
  }

  .menu-content li.selected {
    background: rgba(255, 255, 255, 0.2);
    border-left: 4px solid #fff;
  }

  /* Scrollbar stilleri */
  .menu-content::-webkit-scrollbar {
    width: 8px;
  }

  .menu-content::-webkit-scrollbar-track {
    background: rgba(255, 255, 255, 0.1);
    border-radius: 4px;
  }

  .menu-content::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.3);
    border-radius: 4px;
  }

  .menu-content::-webkit-scrollbar-thumb:hover {
    background: rgba(255, 255, 255, 0.4);
  }

  #my-video {
    width: 100vw;
    height: 100vh;
    object-fit: cover;
  }

  .play-icon {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 80px;
    height: 80px;
    background-color: rgba(0, 0, 0, 0.5);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 1000;
  }

  .play-icon::before {
    content: '';
    width: 0;
    height: 0;
    border-style: solid;
    border-width: 15px 0 15px 25px;
    border-color: transparent transparent transparent #ffffff;
    margin-left: 5px;
  }

  .play-icon.hidden {
    display: none;
  }

  .quality-selector {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 1000;
    background: rgba(0, 0, 0, 0.7);
    padding: 15px;
    border-radius: 5px;
    color: white;
    transition: all 0.3s ease;
    opacity: 1;
    min-width: 150px;
  }

  .quality-selector.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .quality-selector.active {
    background: rgba(0, 0, 0, 0.9);
    transform: scale(1.05);
  }

  .quality-label {
    font-size: 12px;
    opacity: 0.7;
    margin-bottom: 5px;
  }

  .quality-value {
    font-size: 14px;
    padding: 5px;
    border-radius: 3px;
    background: rgba(255, 255, 255, 0.1);
    transition: background 0.3s ease;
  }

  .quality-value.selected {
    background: rgba(255, 255, 255, 0.3);
  }
</style>
