<div class="home-container">
    <div class="main-grid">
        <div class="grid-item tv-card" 
             [routerLink]="channels.length > 0 ? ['/tv', channels[0].originalIndex || 0] : null"
             [class.active]="activeSection === 'main' && activeIndex === 0"
             tabindex="0">
            <div class="card-content">
                <div class="icon-wrapper">
                    <ng-icon name="matTv" class="card-icon"></ng-icon>
                </div>
                <h2>TV</h2>
            </div>
        </div>

        <div class="right-column">
            <div class="grid-item radio-card"
                 [routerLink]="['/radio']"
                 [class.active]="activeSection === 'main' && activeIndex === 1"
                 tabindex="0">
                <div class="card-content">
                    <div class="icon-wrapper">
                        <ng-icon name="matRadio" class="card-icon"></ng-icon>
                    </div>
                    <h2>Radio</h2>
                </div>
            </div>

            <div class="grid-item movies-card"
                 [routerLink]="['/series']"
                 [class.active]="activeSection === 'main' && activeIndex === 2"
                 tabindex="0">
                <div class="card-content">
                    <div class="icon-wrapper">
                        <ng-icon name="matMovie" class="card-icon"></ng-icon>
                    </div>
                    <h2>Movies</h2>
                </div>
            </div>
        </div>
    </div>

    <div class="loading-overlay" *ngIf="isLoading">
        <div class="spinner"></div>
    </div>

    <div class="version-badge">
        v{{appVersion}}
    </div>
</div>
