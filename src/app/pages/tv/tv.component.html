<div class="video-container">
    <video id="my-video" class="video-js vjs-default-skin" [class.hidden]="isAdPlaying" playsinline>
        <source poster="/assets/poster.png" type="video/mp4">
        <p class="vjs-no-js">
            Video.js'i görüntülemek için lütfen JavaScript'i etkinleştirin
        </p>
    </video>
    <div class="play-icon" [class.hidden]="!showPlayIcon || isAdPlaying" (click)="playVideo()"></div>
    
    <app-archillect-tv *ngIf="isAdPlaying"></app-archillect-tv>
</div>

<div class="channel-info-panel" [class.show]="showChannelInfo" *ngIf="channels[currentChannelIndex]">
    <img [src]="channels[currentChannelIndex].poster" class="channel-logo" alt="Logo">
    <div class="channel-text">
        <div class="channel-name">{{ channels[currentChannelIndex].name }}</div>
        <div class="show-name">{{ channels[currentChannelIndex].currentShow || 'Yayın bilgisi yok' }}</div>
    </div>
</div>

<div class="quality-selector" [class.hidden]="!isMenuOpen" [class.active]="isQualitySelectorActive">
    <div class="quality-label">Video Kalitesi</div>
    <div class="quality-value" [class.selected]="isQualitySelectorActive">
        {{availableQualities[selectedQualityIndex]?.label || 'Otomatik'}}
    </div>
</div>

<div class="side-menu" [class.open]="isMenuOpen">
    <div class="menu-content" #menuContent>
        <h2>Kanal Listesi</h2>
        <ul>
            <li *ngFor="let channel of channels; let i = index" [class.selected]="i === selectedIndex">
                <img [src]="channel.poster" [alt]="channel.name">
                <span>{{ channel.name }}</span>
            </li>
        </ul>
    </div>
</div>
